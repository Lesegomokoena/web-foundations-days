<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day 5 - User Directory</title>
</head>
<body>
  <header>
    <h1>User Directory</h1>
    <p>Load and search users from an online API.</p>
  </header>

  <main>
    <section>
      <h2>Users</h2>

      <button id="load-users" type="button">Load Users</button>

      <label for="filter-input">Filter users by name:</label>
      <input
        type="text"
        id="filter-input"
        placeholder="Enter a name..."
      >

      <p id="status" role="status">Click "Load Users" to begin.</p>

      <ul id="users-list"></ul>
    </section>
  </main>

  <script src="users.js" defer></script>
</body>
</html>
