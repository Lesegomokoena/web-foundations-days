
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes - Day 4</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>QuickNotes</h1>
    <p>Your simple note-taking space</p>
  </header>

  <main>
    <section>
      <h2>Write your draft</h2>

      <label for="note-text">Your note</label>
      <textarea id="note-text" maxlength="200" placeholder="Start typing here..."></textarea>

      <p id="char-count">0 / 200 characters</p>
      <p id="word-count">0 words</p>

      <button id="clear-btn" type="button">Clear</button>
      <button id="theme-toggle" type="button">Dark mode</button>
    </section>
  </main>

  <footer>
    <p>Day 4 Web Foundations Practice</p>
  </footer>
</body>
</html>
